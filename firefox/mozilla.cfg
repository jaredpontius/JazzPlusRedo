// JazzPlusRedo (unofficial) - Firefox startup loader. First line must stay a comment.
// Each time Firefox starts, this loads the add-on from:
//   ~/Library/Application Support/JazzPlusRedo/addon
// and reloads it automatically when that folder is updated.
// Remove: run the installer with --remove.
(function () {
  var Cc = Components.classes, Ci = Components.interfaces;
  var home = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties).get("Home", Ci.nsIFile).path;
  var BASE = home + "/Library/Application Support/JazzPlusRedo";
  var ADDON_DIR = BASE + "/addon";
  var LOG = BASE + "/startup.log";

  function file(p) { var f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile); f.initWithPath(p); return f; }
  function log(msg) {
    try {
      var os = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
      os.init(file(LOG), 0x02 | 0x08 | 0x10, 0o644, 0);
      var line = new Date().toISOString() + "  " + msg + "\n";
      os.write(line, line.length);
      os.close();
    } catch (e) {}
  }

  try {
    var Svc = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
    var done = false;

    function watchForUpdates(AM, id) {
      var mf = file(ADDON_DIR + "/manifest.json");
      var last = 0;
      try { last = mf.lastModifiedTime; } catch (e) {}
      var timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
      timer.initWithCallback({
        notify: function () {
          var now = 0;
          try { now = mf.lastModifiedTime; } catch (e) { return; }
          if (now && now !== last) {
            last = now;
            AM.getAddonByID(id).then(function (a) {
              if (a) a.reload().then(function () { log("reloaded after update"); }, function (e) { log("reload failed: " + e); });
            });
          }
        },
      }, 5000, Ci.nsITimer.TYPE_REPEATING_SLACK);
      watchForUpdates.timer = timer;
    }

    function load(topic) {
      if (done) return;
      done = true;
      try {
        var mod = ChromeUtils.importESModule("resource://gre/modules/AddonManager.sys.mjs");
        mod.AddonManager.installTemporaryAddon(file(ADDON_DIR)).then(
          function (a) { log("loaded " + a.id + " v" + a.version); watchForUpdates(mod.AddonManager, a.id); },
          function (e) { log("load failed: " + e); }
        );
      } catch (e) {
        log("load failed: " + e);
      }
    }

    ["final-ui-startup", "sessionstore-windows-restored", "browser-delayed-startup-finished"].forEach(function (topic) {
      var obs = { observe: function () { try { Svc.removeObserver(obs, topic); } catch (e) {} load(topic); } };
      Svc.addObserver(obs, topic);
    });
  } catch (e) {
    log("startup failed: " + e);
  }
})();
